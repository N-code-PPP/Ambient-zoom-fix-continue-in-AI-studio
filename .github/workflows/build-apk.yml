          jCg4EZEquTX3pdFhpa20qlWRygE+VbdTnApA5P+9j+bhXi1PRQsDj6tstEnNh0eeweHDO8PbN/0h
          HaZJUHwxX36dapUoqrQlvdLDCoVP5S7ZnJvr46Tka4yp7gM/ykrYp2BTzCseYd7mr3xHEDMAjqpq
          SmEEn3FH/G1u81DXk00A3VAHA6j0yXt+jquS8zlCTKVVrcs+u/xR47H08II88nuqn/YNynqwpURo
          Ga8KVgVySlKI9bNaPABzV3ISSHzNhgTrydRk1F/OiN9le57jDYgRQbO7GXAJp9p8cVUj2jUZ26ia
          YNuVH/zCsq2k6YwjNQ3qqJEqh8s7NdzevYx2gQ5xClc0Ah5mWXPA15lyPdE0D89lBpq4X0Zk4EvR
          bnAkqLGGJ1nXFOGNu2swTTAxMA0GCWCGSAFlAwQCAQUABCD+A+XUEeKRJxWFSmgLm8ABGwXB+t41
          TcZ00ZS+hkbQXgQUiynvGLW5OM9kVSbBhzWyETxEn1cCAicQ
          B64
          fi

          if ! keytool -list -keystore app/release.keystore -storepass "$STORE_PASS" >/dev/null 2>&1; then
            echo "Generating fresh PKCS12 keystore matching configured credentials..."
            rm -f app/release.keystore
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -storetype PKCS12 \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Ambient Brain, OU=Mobile, O=AmbientBrain, L=Bangkok, ST=Bangkok, C=TH"
          fi

          echo "Release keystore certificate fingerprints:"
          keytool -list -v -keystore app/release.keystore -alias "$ALIAS_NAME" -storepass "$STORE_PASS" 2>/dev/null | grep -E "SHA1:|SHA256:" || true

          # 3. Verify gradle-wrapper.jar integrity; regenerate if corrupted/missing
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || ! unzip -tq gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Regenerating clean gradle-wrapper.jar..."
            mkdir -p /tmp/gw-bootstrap gradle/wrapper
            touch /tmp/gw-bootstrap/settings.gradle.kts
            gradle -p /tmp/gw-bootstrap wrapper --gradle-version 8.9 --no-daemon
            cp /tmp/gw-bootstrap/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
            rm -rf /tmp/gw-bootstrap
          fi

      - name: Resolve Next App Version & Release Tag (Auto-Increment per Successful Release)
        id: app_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - << 'PY'
          import json, os, re, subprocess

          with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
              gradle_txt = f.read()

          m_name = re.search(r'(?:baseVersionName|versionName)\s*=\s*"(\d+)\.(\d+)\.(\d+)"', gradle_txt)
          if not m_name:
              raise RuntimeError("Could not parse base semantic versionName (X.Y.Z) from app/build.gradle.kts")
          base_major, base_minor, base_patch = int(m_name.group(1)), int(m_name.group(2)), int(m_name.group(3))

          m_code = re.search(r'(?:baseVersionCode|versionCode)\s*=\s*(\d+)', gradle_txt)
          base_code = int(m_code.group(1)) if m_code else 19
          base_tuple = (base_major, base_minor, base_patch)

          published_versions = set()
          published_tags = set()
          repo = os.environ.get("GH_REPO", "")

          # Only count successful (non-draft) published GitHub Releases so failed builds never consume a version
          gh_cmd = ["gh", "release", "list", "--limit", "1000", "--json", "tagName,isDraft"]
          if repo:
              gh_cmd.extend(["--repo", repo])
          gh_res = subprocess.run(gh_cmd, capture_output=True, text=True)
          if gh_res.returncode == 0 and gh_res.stdout.strip():
              try:
                  for item in json.loads(gh_res.stdout):
                      if item.get("isDraft"):
                          continue
                      tag = (item.get("tagName") or "").strip()
                      if not tag:
                          continue
                      published_tags.add(tag)
                      m_tag = re.match(r"^v?(\d+)\.(\d+)\.(\d+)$", tag)
                      if m_tag:
                          published_versions.add((int(m_tag.group(1)), int(m_tag.group(2)), int(m_tag.group(3))))
              except Exception as exc:
                  print(f"Warning: could not parse gh release list output: {exc}")

          # Start from base_tuple (e.g., 1.1.9) and advance patch if already published on GitHub Releases
          higher_or_equal = [v for v in published_versions if v >= base_tuple]
          if not higher_or_equal:
              next_major, next_minor, next_patch = base_tuple
              next_code = base_code
          else:
              max_v = max(higher_or_equal)
              next_major, next_minor, next_patch = max_v[0], max_v[1], max_v[2] + 1
              while (next_major, next_minor, next_patch) in published_versions:
                  next_patch += 1
              # Strictly monotonic versionCode anchored to base_code + count of releases >= base
              same_line_delta = (next_patch - base_patch) if (next_major, next_minor) == (base_major, base_minor) else 0
              next_code = base_code + max(len(higher_or_equal), same_line_delta)

          next_version = f"{next_major}.{next_minor}.{next_patch}"
          next_tag = f"v{next_version}"
          while next_tag in published_tags or next_version in published_tags:
              next_patch += 1
              next_code += 1
              next_version = f"{next_major}.{next_minor}.{next_patch}"
              next_tag = f"v{next_version}"

          print(f"Base gradle version: {base_major}.{base_minor}.{base_patch} (versionCode {base_code})")
          print(f"Published semantic releases found: {len(published_versions)}")
          print(f"Resolved build version: {next_version} (versionCode {next_code}, tag {next_tag})")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if not github_output:
              raise RuntimeError("GITHUB_OUTPUT is not set")
          with open(github_output, "a", encoding="utf-8") as f:
              f.write(f"version_name={next_version}\n")
              f.write(f"version_code={next_code}\n")
              f.write(f"tag={next_tag}\n")
          PY

      - name: Run Unit & DB Migration Tests
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ] && unzip -tq gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            ./gradlew :app:testDebugUnitTest --build-cache --parallel --stacktrace --no-daemon
          else
            gradle :app:testDebugUnitTest --build-cache --parallel --stacktrace --no-daemon
          fi

      - name: Build APK(s)
        env:
          CI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          INCLUDE_DEBUG: ${{ inputs.include_debug == true }}
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
        run: |
          if [ -n "${CI_KEYSTORE_PASSWORD}" ]; then export KEYSTORE_PASSWORD="${CI_KEYSTORE_PASSWORD}"; fi
          if [ -n "${CI_KEY_ALIAS}" ]; then export KEY_ALIAS="${CI_KEY_ALIAS}"; fi
          if [ -n "${CI_KEY_PASSWORD}" ]; then export KEY_PASSWORD="${CI_KEY_PASSWORD}"; fi

          TASKS="assembleRelease"
          if [ "${INCLUDE_DEBUG}" = "true" ]; then
            TASKS="assembleRelease assembleDebug"
          fi
          VERSION_FLAGS="-PappVersionCode=${APP_VERSION_CODE} -PappVersionName=${APP_VERSION_NAME}"
          echo "Running Gradle tasks: ${TASKS} (${VERSION_FLAGS})"

          if [ -f gradle/wrapper/gradle-wrapper.jar ] && unzip -tq gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            ./gradlew ${TASKS} ${VERSION_FLAGS} --build-cache --parallel --stacktrace --no-daemon
          else
            gradle ${TASKS} ${VERSION_FLAGS} --build-cache --parallel --stacktrace --no-daemon
          fi

      - name: Prepare APK Artifacts (No Double Zip)
        id: package_apk
        env:
          INCLUDE_DEBUG: ${{ inputs.include_debug == true }}
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          rm -rf staging
          mkdir -p staging

          mapfile -d '' REL_APKS < <(find app/build/outputs/apk/release -type f -name "*.apk" -print0 2>/dev/null | sort -z)
          REL_APK="${REL_APKS[0]:-}"

          if [ -z "$REL_APK" ] || [ ! -f "$REL_APK" ]; then
            echo "::error::Release APK was not generated under app/build/outputs/apk/release"
            exit 1
          fi
          cp "$REL_APK" "staging/ambient-brain-v${APP_VERSION_NAME}-${COMMIT_ID}-release.apk"

          HAS_DEBUG="false"
          if [ "${INCLUDE_DEBUG}" = "true" ]; then
            mapfile -d '' DBG_APKS < <(find app/build/outputs/apk/debug -type f -name "*.apk" -print0 2>/dev/null | sort -z)
            DBG_APK="${DBG_APKS[0]:-}"
            if [ -z "$DBG_APK" ] || [ ! -f "$DBG_APK" ]; then
              echo "::error::Debug APK was not generated under app/build/outputs/apk/debug"
              exit 1
            fi
            cp "$DBG_APK" "staging/ambient-brain-v${APP_VERSION_NAME}-${COMMIT_ID}-debug.apk"
            HAS_DEBUG="true"
          fi

          {
            echo "Project: Ambient Brain (Android)"
            echo "Package: com.ambientbrain.recorder"
            echo "App Version: ${APP_VERSION_NAME} (versionCode ${APP_VERSION_CODE})"
            echo "Commit ID: ${GITHUB_SHA}"
            echo "Commit Short: ${COMMIT_ID}"
            echo "Ref: ${GITHUB_REF}"
            echo "Build Time UTC: $(date -u)"
            echo "Target Platform: Modern Android (Android 14+, arm64-v8a)"
          } > staging/BUILD_INFO.txt

          echo "commit_id=${COMMIT_ID}" >> "$GITHUB_OUTPUT"
          echo "has_debug=${HAS_DEBUG}" >> "$GITHUB_OUTPUT"
          ls -lh staging/

      - name: Create GitHub Release & Attach APK Files
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.app_version.outputs.tag }}
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
          COMMIT_ID: ${{ steps.package_apk.outputs.commit_id }}
          HAS_DEBUG: ${{ steps.package_apk.outputs.has_debug }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::Calculated release tag is empty"
            exit 1
          fi

          FILES=()
          for f in staging/*.apk; do
            if [ -f "$f" ]; then
              FILES+=("$f")
            fi
          done

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No APK files found in staging/ to attach to release"
            exit 1
          fi

          python3 - << 'PY'
          import os
          tag = os.environ["TAG"]
          ver_name = os.environ["APP_VERSION_NAME"]
          ver_code = os.environ["APP_VERSION_CODE"]
          commit_id = os.environ["COMMIT_ID"]
          sha = os.environ.get("GITHUB_SHA", commit_id)
          repo = os.environ.get("GH_REPO", "")
          has_debug = os.environ.get("HAS_DEBUG") == "true"

          rel_name = f"ambient-brain-v{ver_name}-{commit_id}-release.apk"
          dbg_name = f"ambient-brain-v{ver_name}-{commit_id}-debug.apk"

          links = [
              f"- **[Download Signed Release APK v{ver_name} (arm64-v8a)](https://github.com/{repo}/releases/download/{tag}/{rel_name})** (Recommended for 24/7 background capture)"
          ]
          assets = [f"- `{rel_name}`"]
          if has_debug:
              links.append(
                  f"- **[Download Debug APK v{ver_name}](https://github.com/{repo}/releases/download/{tag}/{dbg_name})**"
              )
              assets.append(f"- `{dbg_name}`")

          notes = (
              f"### 🧠 Ambient Brain {tag}\n"
              f"**Package ID:** `com.ambientbrain.recorder`\n"
              f"**App Version:** `{ver_name}` (`versionCode {ver_code}`)\n"
              f"**Target Platform:** Modern Android (Android 14+, arm64-v8a)\n"
              f"**Commit:** `{sha}` (`{commit_id}`)\n\n"
              f"#### 📲 Direct 1-Tap APK Downloads (No Zip Extraction Needed):\n"
              + "\n".join(links) + "\n\n"
              f"#### 📦 Direct APK Assets Attached:\n"
              + "\n".join(assets) + "\n\n"
              f"*Direct raw .apk files attached without zip compression for instant Android package installer launch.*\n"
          )
          with open("/tmp/RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(notes)
          PY

          RELEASE_TITLE="Ambient Brain ${TAG} (${COMMIT_ID})"
          echo "Publishing release $TAG (version $APP_VERSION_NAME / code $APP_VERSION_CODE) with direct APK files: ${FILES[*]}"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GH_REPO"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$GH_REPO" \
              --title "$RELEASE_TITLE" \
              --notes-file /tmp/RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi
