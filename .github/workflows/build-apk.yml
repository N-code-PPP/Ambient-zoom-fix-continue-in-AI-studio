name: Build Android APK & Publish Release

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      include_debug:
        description: 'Also build Debug APK (slower, adds ~3 min)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Accept Android SDK Licenses & Ensure SDK 35
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          if [ -d "$SDK_ROOT/platforms/android-35" ] && [ -d "$SDK_ROOT/build-tools/35.0.0" ] && [ -f "$SDK_ROOT/licenses/android-sdk-license" ]; then
            echo "Android SDK 35, build-tools 35.0.0, and licenses already installed; skipping sdkmanager."
            exit 0
          fi

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            if [ ! -d "$SDK_ROOT/platforms/android-35" ] || [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then
              yes | "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
            fi
          fi
          set -o pipefail

      - name: Verify & Self-Heal Keystore, Wrapper & Resource Files
        env:
          CI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if grep -q $'\r' ./gradlew 2>/dev/null; then
            sed -i 's/\r$//' ./gradlew
          fi
          chmod +x ./gradlew

          # 1. Verify all PNG files in app/src/main/res; repair if corrupted by text sync
          python3 - << 'PY'
          import glob, struct, zlib

          def is_valid_png(path):
              try:
                  with open(path, "rb") as f:
                      data = f.read()
                  if len(data) < 33 or data[:8] != b"\x89PNG\r\n\x1a\n":
                      return False
                  pos = 8
                  idat = bytearray()
                  saw_iend = False
                  while pos + 8 <= len(data):
                      length = struct.unpack(">I", data[pos:pos+4])[0]
                      ctype = data[pos+4:pos+8]
                      if pos + 12 + length > len(data):
                          return False
                      chunk_data = data[pos+8:pos+8+length]
                      crc_expected = struct.unpack(">I", data[pos+8+length:pos+12+length])[0]
                      crc_actual = zlib.crc32(ctype + chunk_data) & 0xffffffff
                      if crc_expected != crc_actual:
                          return False
                      if ctype == b"IDAT":
                          idat.extend(chunk_data)
                      elif ctype == b"IEND":
                          saw_iend = True
                          break
                      pos += 12 + length
                  if not saw_iend or not idat:
                      return False
                  zlib.decompress(bytes(idat))
                  return True
              except Exception:
                  return False

          def write_clean_png(path, size=108):
              def chunk(ctype, cdata):
                  return struct.pack(">I", len(cdata)) + ctype + cdata + struct.pack(">I", zlib.crc32(ctype + cdata) & 0xffffffff)
              ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              raw = bytearray()
              cx = cy = size / 2.0
              r_outer = size * 0.34
              r_inner = size * 0.18
              for y in range(size):
                  raw.append(0)
                  for x in range(size):
                      dx = x - cx
                      dy = y - cy
                      d2 = dx * dx + dy * dy
                      if d2 <= r_inner * r_inner:
                          raw.extend((0, 229, 255, 255))
                      elif d2 <= r_outer * r_outer:
                          raw.extend((19, 36, 58, 255))
                      else:
                          raw.extend((11, 19, 30, 255))
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)

          for p in sorted(glob.glob("app/src/main/res/**/*.png", recursive=True)):
              if not is_valid_png(p):
                  print(f"Repairing corrupted PNG resource: {p}")
                  write_clean_png(p, 108)
          PY

          # 3. Verify app/release.keystore integrity; restore from base64 or keytool if corrupted/missing
          STORE_PASS="${CI_KEYSTORE_PASSWORD:-ambientbrain123}"
          ALIAS_NAME="${CI_KEY_ALIAS:-ambientbrain}"
          KEY_PASS="${CI_KEY_PASSWORD:-ambientbrain123}"

          if [ ! -f app/release.keystore ] || ! keytool -list -keystore app/release.keystore -storepass "$STORE_PASS" >/dev/null 2>&1; then
            echo "Restoring app/release.keystore..."
            cat << 'B64' | tr -d ' \t\r\n' | base64 -d > app/release.keystore
          MIIK0AIBAzCCCnoGCSqGSIb3DQEHAaCCCmsEggpnMIIKYzCCBboGCSqGSIb3DQEHAaCCBasEggWn
          MIIFozCCBZ8GCyqGSIb3DQEMCgECoIIFQDCCBTwwZgYJKoZIhvcNAQUNMFkwOAYJKoZIhvcNAQUM
          MCsEFFdxW+lTzRv57/Vh3OghzHZE93XHAgInEAIBIDAMBggqhkiG9w0CCQUAMB0GCWCGSAFlAwQB
